name: NEXO · macOS beta
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexo-macos-beta
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npm run package:mac --prefix desktop
      - name: Verify universal app and microphone declaration
        run: |
          app="$(ls -d desktop/dist/mac-universal/*.app)"
          lipo "$app/Contents/MacOS/$(basename "$app" .app)" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist" | grep -Fx nexo-desktop
          shasum -a 256 desktop/dist/*.dmg > desktop/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexo-macos-universal
          path: |
            desktop/dist/*.dmg
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  startup:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexo-macos-universal
          path: package
      - name: Launch packaged beta without microphone or visible window
        run: |
          mount="$RUNNER_TEMP/nexo-volume"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" package/*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          app="$(ls -d "$mount"/*.app)"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/$(basename "$app" .app)" --startup-check > startup.json
          cat startup.json
          node -e 'const fs=require("node:fs"); const lines=fs.readFileSync("startup.json","utf8").trim().split("\n"); const s=JSON.parse(lines.at(-1)); if(s.startup!=="ok"||!s.version||s.workspacePanel!=="https://zoraxpilot.com/dashboard/workspace"||s.platform!=="darwin"||!s.sandbox||s.nodeIntegration||!s.alwaysOnTop||!s.allWorkspaces) process.exit(1)'
  self-update:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexo-macos-universal
          path: package
      - name: Replace an installed copy (still named NEXO.app, like 0.2.6) with the image exactly as the app does on update, then start the result
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          dmg="$(ls package/*.dmg)"
          apps="$RUNNER_TEMP/Applications"; seed="$RUNNER_TEMP/seed"
          mkdir -p "$apps" "$seed"
          hdiutil attach -nobrowse -readonly -mountpoint "$seed" "$dmg"
          ditto "$seed"/*.app "$apps/NEXO.app"
          hdiutil detach "$seed"
          echo previous > "$apps/NEXO.app/Contents/Resources/previous-marker"
          node -e 'const m=require("./desktop/mac-install.cjs"); const b=process.argv[1]+"/NEXO.app"; if(!m.installable(b)||m.installable("/Volumes/Zorax/Zorax.app")||m.installable("/private/var/folders/x/AppTranslocation/y/d/Zorax.app")) process.exit(1)' "$apps"
          node desktop/mac-install.cjs --self-test "$dmg" "$apps/NEXO.app" "$version" | tee install.json
          result="$(tail -n 1 install.json)"
          new="$(node -p 'JSON.parse(process.argv[1]).bundle' "$result")"
          exe="$(node -p 'JSON.parse(process.argv[1]).execPath' "$result")"
          test "$(basename "$new")" = "Zorax.app"
          test ! -e "$apps/NEXO.app"
          test -e "$apps/.NEXO-previous.app/Contents/Resources/previous-marker"
          test ! -e "$new/Contents/Resources/previous-marker"
          test ! -e "$dmg"
          codesign --verify --deep --strict "$new"
          "$exe" --startup-check > startup.json
          cat startup.json
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("startup.json","utf8").trim().split("\n").at(-1)); if(s.startup!=="ok"||s.version!==process.argv[1]) process.exit(1)' "$version"
          node -e 'require("./desktop/mac-install.cjs").cleanupPrevious(process.argv[1]).then(removed=>{ if(!removed||require("node:fs").existsSync(process.argv[2])) process.exit(1) })' "$new" "$apps/.NEXO-previous.app"
